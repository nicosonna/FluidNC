[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

; Creality Falcon2 (carte v3.2.S3.402) : module ESP32-S3-WROOM-1 N8R8, dont la
; PSRAM est octale.  Avec la variante quadruple de wifi_s3, la PSRAM n'est pas
; initialisee et FluidNC tourne avec quelques Ko de memoire libre.
[env:wifi_s3_falcon2]
extends = env:wifi_s3
board_build.arduino.memory_type = qio_opi
; Garde la trace d'un plantage en memoire RTC (voir FluidNC/esp32/backtrace.c) :
; la carte n'a pas de console serie accessible.
build_flags =
    ${env:wifi_s3.build_flags}
    -DFALCON2_SAVE_BACKTRACE
    -DFALCON2_BOARD
    -Wl,--wrap=esp_panic_handler
